/* Rank badges use an editorial palette. Match scores still use real numeric thresholds. */
.rank.rank-first{background:#376f5b}
.rank.rank-second{background:#59806a}
.rank.rank-third{background:#b4784a}
.rank.rank-fourth{background:#c3974e}

.site-button.active .rank{box-shadow:0 0 0 2px #dce8dc}
/* Polish: keep the card readable on narrower screens and color each metric by its score. */
.detail,.detail-body,.planner{min-width:0;overflow-x:hidden}
.detail{overscroll-behavior:contain}
.detail *{min-width:0;overflow-wrap:break-word}
.detail .detail-actions button{white-space:normal}
.detail .metric-line{grid-template-columns:70px minmax(0,1fr) 44px}
.detail .bar{min-width:0}
.detail .bar .high{background:#39846a}
.detail .bar .mid{background:#d58a49}
.detail .bar .low{background:#e1b954}
.detail .big-score.low{color:#b08b32}

.climate-item:last-child{border-bottom:0}
.climate-item span{color:#7f8a81}
.climate-item strong{color:#35483d;text-align:right;font-weight:600}

// Reference desk: links come only from the backend JSON and project repository.
function sourceLink(value){
  if(typeof value==='string')return /^https:\/\//i.test(value)?value:null;
  if(value && typeof value==='object'){
    for(const k of ['url','page_url','source_url','link','uri','href']){
      if(typeof value[k]==='string' && /^https:\/\//i.test(value[k]))return value[k];
    }
  }
  return null;
}

  parent.append(section);
  return section;
}

  });

  const climate=refSection(root,arabic?'البيانات المناخية':'Climate context');
  climate.append(el('p','reference-description',arabic?
    'تُعرض المعلومات المناخية عندما تتوفر في ملف النتائج. قد توجد قيم ناقصة، ولا تُستبدل بالصفر.':
    'Climate values are displayed when present in the backend results. Missing values remain unavailable and are never replaced with zeros.'));
  const power=(data.meta.datasets||[]).find(x=>/POWER/i.test(String(x.name||'')));
  if(power)refRow(climate,power.name,sourceLink(power),power.producer||'');

  const imagery=refSection(root,arabic?'مراجع صور أهداف القمر والمريخ':'Moon & Mars target imagery',arabic?
    'روابط صفحات الصور الواردة في نتائج الفريق؛ الصور سياق بصري وليست دليل تحقق ميداني.':
    'Image catalog links supplied in the backend. Images provide context, not terrain or field validation.');
  (data.targets||[]).forEach(target=>{
    const img=target.image||{};
    refRow(imagery,targetName(target),sourceLink(img),[img.image_title,img.credit].filter(Boolean).join(' · '));
  });

  const repo=refSection(root,arabic?'المشروع والمنهجية':'Project & methodology');
  refRow(repo,'Harrah — GitHub repository','https://github.com/Mohyahia1/NAC_Harrah_Project',arabic?'الكود وخط المعالجة':'Source code and pipeline');
  root.append(el('p','reference-caution',arabic?
    'النتائج أولية (PRELIMINARY). درجة التشابه ليست تأكيدًا لصلاحية الموقع أو سلامته؛ ويجب التحقق ميدانيًا. حالة البيانات: '+(data.meta.status||'preliminary'):
    'PRELIMINARY — A similarity score is not a safety or field-suitability certification. On-site verification remains necessary. Data status: '+(data.meta.status||'preliminary')));
  root.append(el('p','reference-footnote',arabic?'تطوير واجهة المستخدم بمساعدة الذكاء الاصطناعي.':'AI-assisted frontend implementation.'));
  showModal(tr('sources'),[root]);
};
async function start(){try{const res=await fetch('./data/results.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);data=await res.json();if(!data.meta||!Array.isArray(data.sites)||!Array.isArray(data.scores)||!Array.isArray(data.targets))throw Error('Unexpected JSON structure');mission=data.meta.missions.lava_tube?'lava_tube':(data.meta.missions.rover?'rover':Object.keys(data.meta.missions)[0]);if(data.targets.some(t=>t.id==='moon_marius_pit')){world='Moon';target='moon_marius_pit';}updateStatus();renderMissions();renderTargets();refresh();}catch(error){$('status').textContent=tr('dataError');console.error(error)}}
$('languageBtn').onclick=()=>{uiLang=uiLang==='en'?'ar':'en';applyLanguage()};
applyLanguage();
start();
</script>
</body>
